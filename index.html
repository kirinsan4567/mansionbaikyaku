<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マンション売却シミュレーター</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --paper:#F5F5F2;
    --panel:#FFFFFF;
    --ink:#222;
    --ink-soft:#666;
    --line:#DDD;
    --navy:#2C5F5A;
    --navy-deep:#1D423E;
    --accent:#B8823D;
    --accent-soft:#F4E7D2;
    --danger:#A6432F;
    --danger-soft:#F8ECE8;
    --radius:8px;
    --header-h:56px;
    --settings-w:400px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'BIZ UDPGothic', Meiryo, sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
    padding-top:var(--header-h);
  }

  /* ===== 固定ヘッダー ===== */
  header.appbar{
    position:fixed; top:0; left:0; right:0; height:var(--header-h);
    background:var(--navy-deep); color:#fff;
    display:flex; align-items:center; gap:12px;
    padding:0 16px; z-index:100;
    box-shadow:0 1px 4px rgba(0,0,0,0.2);
  }
  header.appbar .title{ font-size:15px; font-weight:700; white-space:nowrap; }
  header.appbar .prop-summary{
    font-size:11.5px; color:#CFE0DD; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    flex:1; text-align:right;
  }

  /* ===== レイアウト ===== */
  .layout{ max-width:1280px; margin:0 auto; padding:12px; }
  .settings-col, .results-col{ min-width:0; }
  @media (min-width:900px){
    .layout{
      display:grid;
      grid-template-columns:var(--settings-w) 1fr;
      gap:16px;
      align-items:start;
    }
    .settings-col{
      max-height:calc(100vh - var(--header-h) - 24px);
      overflow-y:auto;
      padding-right:4px;
    }
    .results-col{
      max-height:calc(100vh - var(--header-h) - 24px);
      overflow-y:auto;
      padding-right:4px;
    }
    .mobile-only{ display:none !important; }
  }
  @media (max-width:899px){
    .pc-only{ display:none !important; }
  }

  /* ===== ステップバー(スマホ) ===== */
  .stepbar{
    display:flex; gap:4px; margin-bottom:10px;
  }
  .stepbar button{
    flex:1; padding:8px 2px; font-size:11px; font-family:inherit;
    border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    border-radius:6px; cursor:pointer;
  }
  .stepbar button.active{
    background:var(--navy); border-color:var(--navy); color:#fff; font-weight:700;
  }
  .stepbar button.done{ border-color:var(--navy); color:var(--navy); }

  /* ===== パネル ===== */
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:12px;
  }
  .panel h2{
    font-size:14px; font-weight:700; margin:0 0 12px; padding-bottom:8px;
    border-bottom:2px solid var(--navy);
  }
  .panel h3.sub{ font-size:12.5px; margin:14px 0 6px; color:var(--navy-deep); }
  .field{ margin-bottom:12px; }
  .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px; }
  .field .hint{ font-size:11px; color:var(--ink-soft); margin-top:3px; line-height:1.5; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  input[type=text], input[type=date], input[type=number], select{
    width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:6px;
    background:#FDFDFC; font-size:14px; font-family:inherit; color:var(--ink);
  }
  input:focus, select:focus{
    outline:none; border-color:var(--navy);
    box-shadow:0 0 0 2px rgba(44,95,90,0.15);
  }
  .radio-list label{
    display:flex; align-items:flex-start; gap:8px; font-size:13px;
    padding:7px 0; border-bottom:1px solid var(--line);
  }
  .radio-list label:last-child{ border-bottom:none; }
  .radio-list input{ margin-top:2px; }
  .slider-row{ display:flex; align-items:center; gap:10px; }
  input[type=range]{ flex:1; accent-color:var(--navy); }
  .slider-val{ font-weight:700; min-width:52px; text-align:right; font-size:14px; }
  .segmented{ display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .segmented button{
    flex:1; padding:8px 4px; font-size:12px; background:#FDFDFC; border:none;
    color:var(--ink-soft); cursor:pointer; font-family:inherit;
  }
  .segmented button.active{ background:var(--navy); color:#fff; }

  .yearline{ max-height:200px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; }
  .yearline .yr{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:7px 9px; border-bottom:1px solid var(--line); font-size:12.5px;
  }
  .yearline .yr:last-child{ border-bottom:none; }
  .yearline select{ width:100px; padding:5px 7px; font-size:12.5px; }
  .bulk-btn{
    font-size:11px; color:var(--navy); background:none; border:none;
    text-decoration:underline; cursor:pointer; padding:0; font-family:inherit;
  }

  /* 年別価格エディタ */
  .price-editor{ max-height:320px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; }
  .price-editor .pr{
    display:flex; align-items:center; gap:8px;
    padding:5px 9px; border-bottom:1px solid var(--line);
  }
  .price-editor .pr:last-child{ border-bottom:none; }
  .price-editor .pr .py{ font-size:12px; color:var(--ink-soft); min-width:48px; }
  .price-editor .pr input{ padding:5px 8px; font-size:13px; text-align:right; }
  .price-editor .pr.overridden .py{ color:var(--accent); font-weight:700; }

  /* ボタン */
  .btn{
    padding:10px 14px; border-radius:6px; font-size:14px; font-family:inherit;
    cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink);
  }
  .btn.primary{
    background:var(--navy); border-color:var(--navy); color:#fff; font-weight:700; width:100%;
  }
  .btn.small{ font-size:12px; padding:7px 10px; }
  .navrow{ display:flex; gap:8px; margin-top:6px; }
  .navrow .btn.back{ width:64px; }
  .navrow .btn.primary{ flex:1; }
  .util-row{ display:flex; gap:8px; margin-bottom:10px; }
  .util-row .btn{ flex:1; font-size:12px; padding:7px; color:var(--ink-soft); }

  /* ===== 結果 ===== */
  .summary-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .sum-card{
    background:#FDFDFC; border:1px solid var(--line); border-radius:6px;
    padding:10px 8px; text-align:center;
  }
  .sum-card.reco{ border:2px solid var(--accent); background:var(--accent-soft); }
  .sum-card .lbl{ font-size:10.5px; color:var(--ink-soft); margin-bottom:4px; }
  .sum-card .val{ font-size:14.5px; font-weight:700; }
  .blurred{ filter:blur(6px); user-select:none; }
  .lockbox{
    text-align:center; padding:20px 14px; background:#FDFDFC;
    border:1px dashed var(--line); border-radius:6px; margin-top:12px;
  }
  .lockbox p{ font-size:13px; color:var(--ink-soft); margin:0 0 12px; line-height:1.6; }
  .lockbox input{ text-align:center; letter-spacing:.1em; margin-bottom:10px; }
  .err-msg{ color:var(--danger); font-size:12px; margin-top:6px; display:none; }
  table.tax-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.tax-table td{ padding:6px 0; border-bottom:1px solid var(--line); }
  table.tax-table td:last-child{ text-align:right; font-weight:500; }
  .chart-wrap{ position:relative; height:260px; margin-top:6px; }
  .note-box{
    background:var(--danger-soft); border:1px solid #E4C4BA; border-radius:6px;
    padding:12px; font-size:11.5px; color:#6B2E20; line-height:1.6; margin-top:12px;
  }
  .yearly-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:4px; }
  table.yearly-table{ border-collapse:collapse; font-size:11px; white-space:nowrap; }
  table.yearly-table th, table.yearly-table td{
    padding:5px 9px; border-bottom:1px solid var(--line); text-align:right;
  }
  table.yearly-table th{ color:var(--ink-soft); font-weight:500; }
  table.yearly-table th:first-child, table.yearly-table td:first-child{
    position:sticky; left:0; background:var(--panel); text-align:left;
    border-right:1px solid var(--line); z-index:1;
  }
  .placeholder-msg{
    padding:32px 16px; text-align:center; color:var(--ink-soft); font-size:13px;
    border:1px dashed var(--line); border-radius:var(--radius); background:#FDFDFC;
  }
</style>
</head>
<body>

<header class="appbar">
  <span class="title">マンション売却シミュレーター</span>
  <span class="prop-summary" id="propSummary"></span>
</header>

<div class="layout">
  <div class="settings-col" id="settingsCol">
    <div class="stepbar mobile-only" id="stepbar"></div>
    <div class="util-row">
      <button class="btn" onclick="exportData()">入力内容を保存</button>
      <label style="flex:1;display:flex;">
        <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
        <button class="btn" style="flex:1;" type="button" onclick="document.getElementById('importFile').click()">読み込む</button>
      </label>
    </div>
    <div id="settingsBody"></div>
    <div class="navrow mobile-only" id="mobileNav">
      <button class="btn back" onclick="goStep(-1)">戻</button>
      <button class="btn primary" id="nextBtn" onclick="goStep(1)">次へ</button>
    </div>
    <button class="btn primary pc-only" style="margin-top:4px;" onclick="renderResults()">シミュレーション実行(結果を更新)</button>
  </div>

  <div class="results-col pc-only" id="resultsColPC">
    <div id="resultsBodyPC"></div>
  </div>
</div>

<script>
/* =========================================================
   0. 定数・データテーブル
========================================================= */
const WORKER_URL = "https://mansionbaikyaku-passcode.YOUR-SUBDOMAIN.workers.dev"; // ← 発行されたWorkerのURLに書き換えてください

const STRUCTURES = ["木造","木造モルタル","軽量鉄骨造1","軽量鉄骨造2","重量鉄骨造","RC造","SRC造","れんが造"];
const DIRECTIONS = ["北","北東","東","南東","南","南西","西","北西"];

const DEPRECIATION_TABLE = {
  "木造":        { 住宅用:{new:0.031, usedFallback:0.03030, legalLife:22, residentialLife:33}, 事業用:{new:0.042, usedFallback:0.04166, legalLife:24, residentialLife:24} },
  "木造モルタル": { 住宅用:{new:0.034, usedFallback:0.03333, legalLife:20, residentialLife:30}, 事業用:{new:0.046, usedFallback:0.04545, legalLife:22, residentialLife:22} },
  "軽量鉄骨造1": { 住宅用:{new:0.036, usedFallback:0.03571, legalLife:19, residentialLife:28}, 事業用:{new:0.046, usedFallback:0.04545, legalLife:22, residentialLife:22} },
  "軽量鉄骨造2": { 住宅用:{new:0.025, usedFallback:0.02500, legalLife:27, residentialLife:40}, 事業用:{new:0.034, usedFallback:0.03333, legalLife:30, residentialLife:30} },
  "重量鉄骨造":  { 住宅用:{new:0.020, usedFallback:0.01960, legalLife:34, residentialLife:51}, 事業用:{new:0.027, usedFallback:0.02631, legalLife:38, residentialLife:38} },
  "RC造":        { 住宅用:{new:0.015, usedFallback:0.01428, legalLife:47, residentialLife:70}, 事業用:{new:0.020, usedFallback:0.02000, legalLife:50, residentialLife:50} },
  "SRC造":       { 住宅用:{new:0.015, usedFallback:0.01428, legalLife:47, residentialLife:70}, 事業用:{new:0.020, usedFallback:0.02000, legalLife:50, residentialLife:50} },
  "れんが造":    { 住宅用:{new:0.018, usedFallback:0.01754, legalLife:38, residentialLife:57}, 事業用:{new:0.025, usedFallback:0.02439, legalLife:41, residentialLife:41} }
};

const PRICE_SCENARIOS = {
  best:     { label:"ベスト(年3%上昇)",       rates:[1.0000,1.0300,1.0299,1.0302,1.0300,1.0299,1.0300,1.0302,1.0299,1.0300,1.0300,1.0301,1.0300,1.0300,1.0300,1.0299] },
  moderate: { label:"モデレート(年1%上昇後安定)", rates:[1.0000,1.0100,1.0099,1.0102,1.0101,1.0100,1.0099,1.0102,1.0101,1.0100,1.0099,1.0000,1.0000,1.0000,1.0000,1.0000] },
  worst:    { label:"ワースト(年2-3%下落)",     rates:[1.0000,0.9800,0.9796,0.9792,0.9787,0.9783,0.9778,0.9773,0.9767,0.9762,0.9756,0.9700,0.9691,0.9681,0.9670,0.9659] }
};
const BASE_YEAR = 2026;
const SIM_YEARS = 35;

/* =========================================================
   1. 状態管理
========================================================= */
const defaultState = {
  step:1,
  propertyName:"", buildingName:"", floorNumber:null, roomNumber:"", direction:"南", isCornerUnit:false,
  contractDate:"", totalPrice:23000, currentPrice:null, historicalPrices:{}, yearlyPriceOverrides:{},
  floorArea:71.37, structure:"RC造",
  buildType:"新築", completionDate:"", initialUse:"自宅用", planToMove:"予定なし",
  expenseRate:2.69, expenseAmount:null,
  allocMethod:"contract", contractLandPrice:null, contractBuildingPrice:null,
  consumptionTax:null, landAssessedValue:null, buildingAssessedValue:null, manualBuildingPrice:null,
  yearUsage:{},
  scenario:"moderate",
  saleDate:"2033-07-03",
  brokerageFeeRate:1.5,
  maintenanceFee:15000, repairFund:20000, propertyTax:120000, otherCost:0,
  repairIncrease:false,
  loanBalance:0, loanRate:1.0, loanType:"変動",
  nextPropertyPrice:null, nextExpenseRate:2.69, nextHoldingYears:10, nextScenario:"moderate",
  unlocked:false
};
let state = JSON.parse(JSON.stringify(defaultState));

function loadState(){
  try{
    const saved = localStorage.getItem('mansionbaikyaku_state');
    if(saved){ state = Object.assign({}, defaultState, JSON.parse(saved)); }
    if(!state.saleDate) state.saleDate = defaultState.saleDate;
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem('mansionbaikyaku_state', JSON.stringify(state)); }catch(e){}
}
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const rawName = state.propertyName || state.buildingName || "";
  const slug = rawName.replace(/[\\/:*?"<>|\s]+/g,'').slice(0,12);
  a.href = url;
  a.download = slug ? `mansionbaikyaku_${slug}.json` : "mansionbaikyaku_input.json";
  a.click();
  URL.revokeObjectURL(url);
}
function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      state = Object.assign({}, defaultState, data);
      saveState(); render();
    }catch(err){ alert("読み込みに失敗しました。ファイル形式をご確認ください。"); }
  };
  reader.readAsText(file);
}

/* =========================================================
   2. 計算ロジック
========================================================= */
function getSaleYear(s){
  return s.saleDate ? new Date(s.saleDate).getFullYear() : BASE_YEAR + 7;
}

function calcElapsedYears(fromDateStr, toDateStr){
  if(!fromDateStr || !toDateStr) return 0;
  const from = new Date(fromDateStr), to = new Date(toDateStr);
  let months = (to.getFullYear()-from.getFullYear())*12 + (to.getMonth()-from.getMonth());
  const dayDiff = to.getDate()-from.getDate();
  if(dayDiff < 0) months -= 1;
  let years = Math.floor(months/12);
  const remMonths = months % 12;
  if(remMonths >= 6) years += 1;
  return Math.max(years,0);
}

function determineBuildingPrice(s){
  const total = Number(s.totalPrice)||0;
  if(s.allocMethod==="contract" && s.contractLandPrice && s.contractBuildingPrice){
    return { building:Number(s.contractBuildingPrice), land:Number(s.contractLandPrice), method:"契約書記載" };
  }
  if(s.allocMethod==="tax" && s.consumptionTax){
    const TAX_RATE = 0.10;
    const buildingExTax = Number(s.consumptionTax)/TAX_RATE;
    const buildingIncTax = buildingExTax*(1+TAX_RATE);
    return { building:buildingIncTax, land: total-buildingIncTax, method:"消費税逆算" };
  }
  if(s.allocMethod==="assessed" && s.landAssessedValue && s.buildingAssessedValue){
    const ratio = Number(s.buildingAssessedValue)/(Number(s.landAssessedValue)+Number(s.buildingAssessedValue));
    return { building: total*ratio, land: total*(1-ratio), method:"固定資産税評価額按分" };
  }
  const b = Number(s.manualBuildingPrice)||0;
  return { building:b, land: total-b, method:"手入力" };
}

function allocateExpenses(totalExpenses, buildingPrice, totalPrice){
  const ratio = totalPrice>0 ? buildingPrice/totalPrice : 0;
  return { buildingExpenses: totalExpenses*ratio, landExpenses: totalExpenses*(1-ratio) };
}

function calcResidualUsefulLife(residentialLife, elapsedYearsAtPurchase){
  let n;
  if(elapsedYearsAtPurchase >= residentialLife){
    n = Math.floor(residentialLife*0.2);
  } else {
    n = Math.floor((residentialLife-elapsedYearsAtPurchase) + elapsedYearsAtPurchase*0.2);
  }
  return Math.max(n,2);
}
function calcUsedDepreciationRate(n){
  return Math.floor((1/n)*100000)/100000;
}

function getDepreciationRateForYear(s, usage, buildingPriceAtPurchase, purchaseElapsedAtBuy){
  const usageKey = usage === "事業用" ? "事業用" : "住宅用";
  const table = DEPRECIATION_TABLE[s.structure]["住宅用"];
  const usageTable = DEPRECIATION_TABLE[s.structure][usageKey];
  if(s.buildType === "新築"){
    return usageTable.new;
  } else {
    const n = calcResidualUsefulLife(table.residentialLife, purchaseElapsedAtBuy);
    return calcUsedDepreciationRate(n);
  }
}

function getYearUsage(s, year){
  return s.yearUsage[year] || s.initialUse;
}

function priceForYear(s, year){
  const purchasePrice = Number(s.totalPrice)||0;
  const currentBase = s.currentPrice ? Number(s.currentPrice) : purchasePrice;
  const purchaseYear = s.contractDate ? new Date(s.contractDate).getFullYear() : BASE_YEAR;

  // 年別の手入力(将来)を最優先
  if(year > BASE_YEAR && s.yearlyPriceOverrides && s.yearlyPriceOverrides[year]){
    return Number(s.yearlyPriceOverrides[year]);
  }
  // 過去の実測価格
  if(s.historicalPrices && s.historicalPrices[year]){
    return Number(s.historicalPrices[year]);
  }

  if(year <= BASE_YEAR){
    if(year <= purchaseYear) return purchasePrice;
    if(purchaseYear >= BASE_YEAR) return currentBase;
    let loYear = purchaseYear, loPrice = purchasePrice;
    let hiYear = BASE_YEAR, hiPrice = currentBase;
    if(s.historicalPrices){
      Object.keys(s.historicalPrices).forEach(k=>{
        const ky = Number(k), kp = Number(s.historicalPrices[k]);
        if(!kp) return;
        if(ky < year && ky > loYear){ loYear = ky; loPrice = kp; }
        if(ky > year && ky < hiYear){ hiYear = ky; hiPrice = kp; }
      });
    }
    const span = Math.max(hiYear - loYear, 1);
    const cagr = Math.pow(hiPrice/loPrice, 1/span) - 1;
    return loPrice * Math.pow(1+cagr, year - loYear);
  }

  const idx = year - BASE_YEAR;
  const rates = PRICE_SCENARIOS[s.scenario].rates;
  const clampedIdx = Math.max(0, Math.min(idx, rates.length-1));
  return currentBase * rates[clampedIdx];
}

function man(n){
  if(n===null||n===undefined||isNaN(n)) return "-";
  return Math.round(n).toLocaleString('ja-JP') + "万円";
}

function computeTaxDetail(taxableGain, holdingYears){
  taxableGain = Math.max(taxableGain, 0);
  let income, resident;
  if(holdingYears < 5){
    income = taxableGain * 0.3063;
    resident = taxableGain * 0.09;
  } else if(holdingYears < 10){
    income = taxableGain * 0.15315;
    resident = taxableGain * 0.05;
  } else {
    const threshold = 6000;
    if(taxableGain <= threshold){
      income = taxableGain * 0.1021;
      resident = taxableGain * 0.04;
    } else {
      income = threshold*0.1021 + (taxableGain-threshold)*0.15315;
      resident = threshold*0.04 + (taxableGain-threshold)*0.05;
    }
  }
  return { income, resident, total: income + resident };
}

function simulateReplacement(s, firstResult){
  if(s.planToMove !== '予定あり' || !s.nextPropertyPrice) return null;

  const nextPrice = Number(s.nextPropertyPrice);
  const nextExpense = nextPrice * (Number(s.nextExpenseRate)||2.69)/100;
  const nextHoldYears = Math.max(Number(s.nextHoldingYears)||10, 1);
  const rates = PRICE_SCENARIOS[s.nextScenario||'moderate'].rates;
  const idx = Math.max(0, Math.min(nextHoldYears, rates.length-1));
  const nextFutureSalePrice = nextPrice * rates[idx];
  const nextSaleExpense = nextFutureSalePrice * 0.015;

  const acqA = nextPrice + nextExpense;
  const gainA = nextFutureSalePrice - acqA - nextSaleExpense;
  const taxA = computeTaxDetail(gainA, nextHoldYears);
  const lifetimeTaxA = firstResult.detail3000.total + taxA.total;

  const acqB = Math.max(acqA - firstResult.deferredGain, 0);
  const gainB = nextFutureSalePrice - acqB - nextSaleExpense;
  const taxB = computeTaxDetail(gainB, nextHoldYears);
  const lifetimeTaxB = firstResult.detailDeferred.total + taxB.total;

  return {
    nextFutureSalePrice, nextSaleExpense,
    routeA:{ acq:acqA, gain:gainA, tax:taxA, lifetimeTax:lifetimeTaxA },
    routeB:{ acq:acqB, gain:gainB, tax:taxB, lifetimeTax:lifetimeTaxB },
    recommend: lifetimeTaxA <= lifetimeTaxB ? 'A' : 'B'
  };
}

function runFullCalculation(s){
  const alloc = determineBuildingPrice(s);
  const expenseTotal = s.expenseAmount ? Number(s.expenseAmount) : Number(s.totalPrice)*Number(s.expenseRate)/100;
  const expAlloc = allocateExpenses(expenseTotal, alloc.building, Number(s.totalPrice));
  const buildingAcqCost = alloc.building + expAlloc.buildingExpenses;
  const landAcqCost = alloc.land + expAlloc.landExpenses;

  const purchaseElapsed = calcElapsedYears(s.completionDate, s.contractDate);
  const saleYear = getSaleYear(s);
  const holdingYears = calcElapsedYears(s.contractDate, s.saleDate || `${saleYear}-01-01`);

  let cumulativeDepreciation = 0;
  const startYear = s.contractDate ? new Date(s.contractDate).getFullYear() : BASE_YEAR;
  for(let y=startYear; y<saleYear; y++){
    const usage = getYearUsage(s, y);
    const rate = getDepreciationRateForYear(s, usage, alloc.building, purchaseElapsed);
    const annual = Math.min(buildingAcqCost*0.9*rate, buildingAcqCost*0.95 - cumulativeDepreciation);
    cumulativeDepreciation += Math.max(annual,0);
  }

  const acquisitionCost = (buildingAcqCost - cumulativeDepreciation) + landAcqCost;
  const salePrice = interpolateSalePrice(s);
  const saleExpense = salePrice * Number(s.brokerageFeeRate)/100;

  const gain = salePrice - acquisitionCost - saleExpense;
  const isLongTerm = holdingYears >= 5;

  const detailNoException = computeTaxDetail(gain, holdingYears);
  const gainAfter3000 = Math.max(gain - 3000, 0);
  const detail3000 = computeTaxDetail(gainAfter3000, holdingYears);
  const detailDeferred = { income:0, resident:0, total:0 };
  const deferredGain = Math.max(gain, 0);

  const netCash = {
    noException: salePrice - saleExpense - detailNoException.total - Number(s.loanBalance),
    plan3000:    salePrice - saleExpense - detail3000.total - Number(s.loanBalance),
    deferred:    salePrice - saleExpense - detailDeferred.total - Number(s.loanBalance)
  };

  return {
    alloc, buildingAcqCost, landAcqCost, cumulativeDepreciation, acquisitionCost,
    salePrice, saleExpense, gain, isLongTerm, holdingYears,
    detailNoException, detail3000, detailDeferred, deferredGain,
    netCash
  };
}

/* 売却日の日割り補間(年月日指定) */
function interpolateSalePrice(s){
  if(!s.saleDate) return priceForYear(s, getSaleYear(s));
  const d = new Date(s.saleDate);
  const y = d.getFullYear();
  const p0 = priceForYear(s, y);
  const p1 = priceForYear(s, y+1);
  const startOfYear = new Date(`${y}-01-01`);
  const daysInYear = ((y%4===0 && y%100!==0)||y%400===0) ? 366 : 365;
  const dayOfYear = Math.round((d - startOfYear)/86400000);
  const ratio = Math.max(0, Math.min(dayOfYear/daysInYear, 1));
  return p0 + (p1-p0)*ratio;
}

function calcAccruedGainForYear(s, year){
  const price = priceForYear(s, year);
  const purchaseExpenseTotal = s.expenseAmount ? Number(s.expenseAmount) : Number(s.totalPrice)*Number(s.expenseRate)/100;
  const saleExpenseAtYear = price * Number(s.brokerageFeeRate)/100;
  return price - Number(s.totalPrice) - purchaseExpenseTotal - saleExpenseAtYear;
}

function computeDepreciationSeries(s, maxYearExclusive){
  const alloc = determineBuildingPrice(s);
  const expenseTotal = s.expenseAmount ? Number(s.expenseAmount) : Number(s.totalPrice)*Number(s.expenseRate)/100;
  const expAlloc = allocateExpenses(expenseTotal, alloc.building, Number(s.totalPrice));
  const buildingAcqCost = alloc.building + expAlloc.buildingExpenses;
  const landAcqCost = alloc.land + expAlloc.landExpenses;
  const purchaseElapsedAtBuy = calcElapsedYears(s.completionDate, s.contractDate);
  const purchaseYear = s.contractDate ? new Date(s.contractDate).getFullYear() : BASE_YEAR;

  let cumulative = 0;
  const series = {};
  for(let y=purchaseYear; y<maxYearExclusive; y++){
    const usage = getYearUsage(s, y);
    const rate = getDepreciationRateForYear(s, usage, alloc.building, purchaseElapsedAtBuy);
    series[y] = { cumulativeBefore: cumulative, rate };
    const annual = Math.min(buildingAcqCost*0.9*rate, buildingAcqCost*0.95 - cumulative);
    cumulative += Math.max(annual,0);
  }
  series[maxYearExclusive] = { cumulativeBefore: cumulative, rate: null };
  return { series, buildingAcqCost, landAcqCost, alloc };
}

function computeYearlyTable(s){
  const purchaseYear = s.contractDate ? new Date(s.contractDate).getFullYear() : BASE_YEAR;
  const endYear = purchaseYear + SIM_YEARS;
  const dep = computeDepreciationSeries(s, endYear+1);
  const tsubo = Number(s.floorArea)>0 ? Number(s.floorArea)/3.30578 : 0;
  const purchasePrice = Number(s.totalPrice)||0;
  const purchaseExpenseTotal = s.expenseAmount ? Number(s.expenseAmount) : purchasePrice*Number(s.expenseRate)/100;
  const contractD = s.contractDate ? new Date(s.contractDate) : new Date(`${purchaseYear}-01-01`);

  const rows = [];
  let prevPrice = null;
  for(let y=purchaseYear; y<=endYear; y++){
    const price = priceForYear(s,y);
    const pricePerTsubo = tsubo>0 ? price/tsubo : 0;
    const growthRateYoY = prevPrice ? (price/prevPrice - 1) : null;
    const priceChange = price - purchasePrice;
    const priceChangeRate = purchasePrice ? priceChange/purchasePrice : 0;
    const priceChangePerTsubo = tsubo>0 ? priceChange/tsubo : 0;
    const accruedGain = calcAccruedGainForYear(s,y);

    const expenseThisYear = y===purchaseYear ? purchaseExpenseTotal : price*Number(s.brokerageFeeRate)/100;
    const expenseRateDisplay = y===purchaseYear ? Number(s.expenseRate) : Number(s.brokerageFeeRate);
    const buildingExpensePortion = purchasePrice ? expenseThisYear*(dep.alloc.building/purchasePrice) : 0;

    const anniversary = new Date(contractD.getTime());
    anniversary.setFullYear(y);
    const realDays = Math.max(Math.round((anniversary - contractD)/86400000), 0);
    const realYears = realDays/365.25;
    const jan1 = new Date(`${y}-01-01`);
    const taxDays = Math.max(Math.round((jan1 - contractD)/86400000), 0);
    const taxYears = Math.floor(taxDays/365.25);
    const classification = taxYears>=5 ? '長期' : '短期';

    const cumulativeDep = dep.series[y] ? dep.series[y].cumulativeBefore : 0;
    const rateUsed = dep.series[y] ? dep.series[y].rate : 0;
    const acquisitionCost = (dep.buildingAcqCost - cumulativeDep) + dep.landAcqCost;
    const taxableGainRaw = price - acquisitionCost - expenseThisYear;
    const exemption3000 = Math.min(Math.max(taxableGainRaw,0), 3000);
    const taxableAfter3000 = Math.max(taxableGainRaw - 3000, 0);
    const taxDetail = computeTaxDetail(taxableAfter3000, taxYears);
    const netProfit = price - expenseThisYear - taxDetail.total;

    rows.push({
      year:y, price, pricePerTsubo, growthRateYoY, priceChange, priceChangeRate, priceChangePerTsubo,
      accruedGain, expenseThisYear, expenseRateDisplay, buildingExpensePortion, buildingPrice: dep.alloc.building,
      realYears, realDays, taxYears, taxDays, classification,
      depreciationYearsUsed: y-purchaseYear, rateUsed: rateUsed||0, cumulativeDep, acquisitionCost,
      taxableGainRaw, exemption3000, taxableAfter3000,
      taxTotal: taxDetail.total, taxIncome: taxDetail.income, taxResident: taxDetail.resident,
      netProfit
    });
    prevPrice = price;
  }
  return rows;
}

/* =========================================================
   3. パスコード確認(Cloudflare Workers)
========================================================= */
async function verifyPasscode(input){
  try{
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ passcode: input })
    });
    if(!res.ok) return false;
    const data = await res.json();
    return !!data.ok;
  }catch(e){
    console.error("パスコード確認に失敗しました", e);
    return false;
  }
}

/* =========================================================
   4. DOMユーティリティ
========================================================= */
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='html') e.innerHTML = v;
    else if(k.startsWith('on')) e.addEventListener(k.substring(2), v);
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(typeof c === 'string') e.appendChild(document.createTextNode(c));
    else if(c) e.appendChild(c);
  });
  return e;
}
function field(labelText, inputEl, hint){
  const wrap = el('div',{class:'field'});
  wrap.appendChild(el('label',{},labelText));
  wrap.appendChild(inputEl);
  if(hint) wrap.appendChild(el('div',{class:'hint'},hint));
  return wrap;
}
function bindInput(input, key, isNumber){
  input.value = state[key] ?? "";
  input.addEventListener('input', ()=>{
    state[key] = isNumber ? (input.value===""?null:Number(input.value)) : input.value;
    saveState();
    if(key==='propertyName'||key==='buildingName'||key==='floorNumber'||key==='roomNumber') updateHeaderSummary();
  });
  return input;
}
function bindSelect(select, key, options, rerenderOnChange){
  options.forEach(o=>{
    const opt = document.createElement('option');
    opt.value = o; opt.textContent = o;
    if(state[key]===o) opt.selected = true;
    select.appendChild(opt);
  });
  select.addEventListener('change', ()=>{
    state[key]=select.value; saveState();
    if(key==='direction'||key==='initialUse') updateHeaderSummary();
    if(rerenderOnChange) renderSettings();
  });
  return select;
}
function isPC(){
  return window.matchMedia('(min-width:900px)').matches;
}

  row3.appendChild(field('購入諸経費率(%)', bindInput(el('input',{type:'number', step:'0.01'}),'nextExpenseRate',true)));
  row3.appendChild(field('何年後に売る想定か', bindInput(el('input',{type:'number'}),'nextHoldingYears',true)));
  p.appendChild(row3);
  const seg3 = el('div',{class:'segmented'});
  Object.entries(PRICE_SCENARIOS).forEach(([key,v])=>{
    const btn = el('button',{}, v.label.split('(')[0]);

  return p;
}

/* =========================================================
   7. 結果画面
========================================================= */
let chartInstance = null;

function buildResults(){
  const wrap = document.createDocumentFragment();
  const result = runFullCalculation(state);
  const replacement = simulateReplacement(state, result);

  const p1 = el('div',{class:'panel'});
  p1.appendChild(el('h2',{},'手取り額サマリー(3パターン比較)'));
  const bestNow = Math.max(result.netCash.plan3000, result.netCash.deferred);
  const grid = el('div',{class:'summary-grid'});
  const futureCardVal = !state.unlocked ? null
    : (replacement
        ? man(Math.min(replacement.routeA.lifetimeTax, replacement.routeB.lifetimeTax)) + '(生涯合計税額)'
        : man(result.deferredGain) + '(繰延譲渡益)');
  const cards = [
    ['税額最小', man(bestNow), false],
    ['現在手取り最大', man(bestNow), true],
    ['将来影響考慮(参考)', futureCardVal, false]
  ];
  cards.forEach(([lbl,val,reco])=>{
    const c = el('div',{class:'sum-card'+(reco?' reco':'')});
    c.appendChild(el('div',{class:'lbl'},lbl+(reco?' ★':'')));
    c.appendChild(el('div',{class:'val'+(val===null?' blurred':'')}, val===null ? '●●●万円' : val));
    grid.appendChild(c);
  });
  p1.appendChild(grid);
  wrap.appendChild(p1);

  if(!state.unlocked){
    const lockp = el('div',{class:'panel'});
    lockp.appendChild(el('h2',{},'詳細結果を見る'));
    const box = el('div',{class:'lockbox'});
    box.appendChild(el('p',{},'正確な税額内訳・詳細な比較・チャート・年別詳細表は、noteの有料記事に記載されたパスコードで解除できます。'));
    const pinput = el('input',{type:'text', placeholder:'パスコードを入力'});
    box.appendChild(pinput);
    const errMsg = el('div',{class:'err-msg'},'パスコードが正しくありません。');
    const btn = el('button',{class:'btn primary', style:'width:auto;padding:10px 24px;'}, '解除する');
    btn.addEventListener('click', async ()=>{
      btn.textContent = '確認中...';
      const ok = await verifyPasscode(pinput.value.trim());
      if(ok){
        state.unlocked = true; saveState(); render();
      } else {
        btn.textContent = '解除する';
        errMsg.style.display='block';
      }
    });
    box.appendChild(btn);
    box.appendChild(errMsg);
    lockp.appendChild(box);
    wrap.appendChild(lockp);
  } else {
    const p2 = el('div',{class:'panel'});
    p2.appendChild(el('h2',{},'税額内訳'));
    const table = el('table',{class:'tax-table'});
    const rows = [
      ['譲渡価格', man(result.salePrice)],
      ['取得費', man(result.acquisitionCost)],
      ['譲渡諸経費', man(result.saleExpense)],
      ['譲渡所得(控除前)', man(result.gain)],
      ['保有期間', `${result.holdingYears}年(${result.isLongTerm?'長期譲渡':'短期譲渡'})`],
      ['税額(特例なし)合計', man(result.detailNoException.total)],
      ['　うち所得税(復興税込)', man(result.detailNoException.income)],
      ['　うち住民税', man(result.detailNoException.resident)],
      ['税額(3,000万円控除適用)合計', man(result.detail3000.total)],
      ['　うち所得税(復興税込)', man(result.detail3000.income)],
      ['　うち住民税', man(result.detail3000.resident)],
      ['税額(買換え特例=課税繰延)', man(result.detailDeferred.total)]
    ];
    rows.forEach(([k,v])=>{
      const tr = document.createElement('tr');
      tr.appendChild(el('td',{},k));
      tr.appendChild(el('td',{},v));
      table.appendChild(tr);
    });
    p2.appendChild(table);
    wrap.appendChild(p2);

    const p2b = el('div',{class:'panel'});
    if(replacement){
      p2b.appendChild(el('h2',{},'住み替え先を含めた生涯合計納税額の比較'));
      p2b.appendChild(el('p',{style:'font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:0 0 10px;'},
        `${state.nextHoldingYears}年後に住み替え先を売却すると仮定した場合の、生涯トータルの納税額を比較しました。`));
      const cmpTable = el('table',{class:'tax-table'});
      const cmpRows = [
        ['ルートA:今回3,000万円控除を使う', ''],
        ['　今回の税額', man(result.detail3000.total)],
        ['　住み替え先 将来売却時の税額', man(replacement.routeA.tax.total)],
        ['　生涯合計', man(replacement.routeA.lifetimeTax)],
        ['ルートB:今回買換え特例を使う', ''],
        ['　今回の税額', man(result.detailDeferred.total)],
        ['　住み替え先 将来売却時の税額', man(replacement.routeB.tax.total)],
        ['　生涯合計', man(replacement.routeB.lifetimeTax)]
      ];
      cmpRows.forEach(([k,v])=>{
        const tr = document.createElement('tr');
        const isHeader = v==='';
        tr.appendChild(el('td',{style:isHeader?'font-weight:700;padding-top:12px;border-bottom:none;':''},k));
        tr.appendChild(el('td',{style:isHeader?'border-bottom:none;':''},v));
        cmpTable.appendChild(tr);
      });
      p2b.appendChild(cmpTable);
      const reco = replacement.recommend==='A' ? '3,000万円控除' : '買換え特例';
      p2b.appendChild(el('p',{style:'font-size:13px;font-weight:500;margin:12px 0 0;color:var(--navy);'},
        `→ 入力条件では「${reco}」を選ぶ方が生涯合計の納税額が少なくなる見込みです。`));
      p2b.appendChild(el('p',{style:'font-size:11.5px;color:var(--ink-soft);line-height:1.6;margin:10px 0 0;'},
        '※住み替え先の将来売却価格は入力いただいたシナリオに基づく概算です。実際の価格変動・税制改正により結果は変わります。'));
    } else {
      p2b.appendChild(el('h2',{},'買換え特例を選んだ場合の将来影響(参考)'));
      p2b.appendChild(el('p',{style:'font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:0 0 8px;'},
        `買換え特例は「非課税」ではなく「将来への繰延べ」です。今回の譲渡益 ${man(result.deferredGain)} 相当は課税されない代わりに、買換え先の物件の取得費から差し引かれた状態で引き継がれます。つまり、次にその物件を売却するときの譲渡所得が、その分だけ大きくなります。`));
      p2b.appendChild(el('p',{style:'font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:0;'},
        '「売却後の住み替え予定」を「予定あり」にし、住み替え先の想定価格などを入力すると、生涯合計での比較が表示されます。'));
    }
    wrap.appendChild(p2b);

    const p3 = el('div',{class:'panel'});
    p3.appendChild(el('h2',{},'売却益推定チャート'));
    const chartWrap = el('div',{class:'chart-wrap'});
    const canvas = el('canvas');
    chartWrap.appendChild(canvas);
    p3.appendChild(chartWrap);
    wrap.appendChild(p3);
    setTimeout(()=>drawChart(canvas, state), 0);

    const p4 = el('div',{class:'panel'});
    p4.appendChild(el('h2',{},'年別詳細シミュレーション(購入年から35年)'));
    p4.appendChild(el('p',{style:'font-size:11.5px;color:var(--ink-soft);margin:0 0 4px;'},
      '横にスクロールできます。売却予定年以降も、その年に売却したと仮定した場合の参考値として表示しています。'));
    p4.appendChild(renderYearlyTables(computeYearlyTable(state)));
    wrap.appendChild(p4);
  }

  const note = el('div',{class:'note-box'});
  note.innerHTML = '3,000万円特別控除を選択すると、その前後数年間(目安:控除適用年から4年程度)は新居の住宅ローン控除が使えなくなる可能性があります。また、各特例の適用期限・要件は税制改正により変更されることがあります。最終的な判断の前に、税理士または国税庁サイトでのご確認をおすすめします。';
  wrap.appendChild(note);

  return wrap;
}

function renderYearlyTables(rows){
  const frag = document.createDocumentFragment();

  const groups = [
    { title:'物件価格・含み益', metrics:[
      ['物件価格', r=>man(r.price)],
      ['坪単価', r=>man(r.pricePerTsubo)],
      ['価格上昇率(対前年)', r=> r.growthRateYoY===null?'-':(r.growthRateYoY*100).toFixed(1)+'%'],
      ['価格変動幅(購入価格比)', r=>man(r.priceChange)],
      ['価格変動率', r=>(r.priceChangeRate*100).toFixed(0)+'%'],
      ['売買価格差坪単価', r=>man(r.priceChangePerTsubo)],
      ['含み益', r=>man(r.accruedGain)],
      ['諸経費(購入時/売却時)', r=>man(r.expenseThisYear)],
      ['経費率', r=>r.expenseRateDisplay.toFixed(2)+'%'],
      ['うち建物分', r=>man(r.buildingExpensePortion)],
      ['建物価格', r=>man(r.buildingPrice)]
    ]},
    { title:'課税対象額の計算', metrics:[
      ['所有期間(実質・年)', r=>r.realYears.toFixed(1)],
      ['所有期間(実質・日)', r=>r.realDays.toLocaleString()],
      ['譲渡課税上の所有期間(年)', r=>r.taxYears],
      ['譲渡課税上の所有期間(日)', r=>r.taxDays.toLocaleString()],
      ['譲渡所得課税分類', r=>r.classification],
      ['減価償却年数', r=>r.depreciationYearsUsed],
      ['減価償却率 r', r=>r.rateUsed.toFixed(5)],
      ['減価償却費(累計)', r=>man(r.cumulativeDep)],
      ['取得費', r=>man(r.acquisitionCost)],
      ['譲渡所得', r=>man(r.taxableGainRaw)],
      ['3,000万円特別控除分', r=>man(r.exemption3000)],
      ['通常課税分', r=>man(r.taxableAfter3000)]
    ]},
    { title:'課税額・売却益', metrics:[
      ['課税額合計', r=>man(r.taxTotal)],
      ['　うち所得税', r=>man(r.taxIncome)],
      ['　うち住民税', r=>man(r.taxResident)],
      ['売却益(課税後)', r=>man(r.netProfit)]
    ]}
  ];

  groups.forEach(g=>{
    frag.appendChild(el('h3',{style:'font-size:13px;margin:16px 0 6px;color:var(--navy-deep);'}, g.title));
    const wrap = el('div',{class:'yearly-wrap'});
    const table = el('table',{class:'yearly-table'});
    const headRow = document.createElement('tr');
    headRow.appendChild(el('th',{}, ''));
    rows.forEach(r=> headRow.appendChild(el('th',{}, String(r.year))));
    table.appendChild(headRow);
    g.metrics.forEach(([label, fn])=>{
      const tr = document.createElement('tr');
      tr.appendChild(el('td',{}, label));
      rows.forEach(r=> tr.appendChild(el('td',{}, String(fn(r)))));
      table.appendChild(tr);
    });
    wrap.appendChild(table);
    frag.appendChild(wrap);
  });

  return frag;
}

function drawChart(canvas, s){
  if(chartInstance) chartInstance.destroy();
  const rows = computeYearlyTable(s);
  const maxChartYear = BASE_YEAR + 15;
  const visible = rows.filter(r=> r.year <= maxChartYear);

  const labels = visible.map(r=>r.year);
  const netProfit = visible.map(r=>Math.round(r.netProfit));
  const priceDiff = visible.map(r=>Math.round(r.priceChange));
  const accrued  = visible.map(r=>Math.round(r.accruedGain));

  chartInstance = new Chart(canvas, {
    data:{
      labels,
      datasets:[
        { type:'bar', label:'売却益(課税後)', data:netProfit, backgroundColor:'#E8B4B0', order:3 },
        { type:'line', label:'売買価格差', data:priceDiff, borderColor:'#8B1E1E', backgroundColor:'#8B1E1E', borderWidth:2, pointRadius:0, tension:0.2, order:1 },
        { type:'line', label:'含み益', data:accrued, borderColor:'#8B1E1E', backgroundColor:'#8B1E1E', borderDash:[4,4], borderWidth:2, pointRadius:0, tension:0.2, order:2 }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:true, position:'top', labels:{ font:{size:10}, boxWidth:18 } } },
      scales:{ y:{ beginAtZero:true, ticks:{ font:{size:10} } }, x:{ ticks:{ font:{size:10} } } }
    }
  });
}

/* =========================================================
   8. 画面描画(PC/スマホ分岐)
========================================================= */
const STEP_LABELS = ["基本条件","価格予測","課税計算","維持費","ローン","結果"];

const MOBILE_STEP_SECTIONS = {
  1: ()=>[buildPropertyPanel(), buildAllocationPanel(), buildExpenseUsagePanel(), buildYearUsagePanel()],
  2: ()=>[buildPricePanel(), buildSaleTimingPanel(), buildReplacementPanel()].filter(Boolean),
  3: ()=>[buildSaleExpensePanel()],
  4: ()=>[buildMaintenancePanel()],
  5: ()=>[buildLoanPanel()],
  6: ()=>[] // 結果はrenderResultsで
};

function renderStepbar(){
  const bar = document.getElementById('stepbar');
  bar.innerHTML = "";
  for(let i=1;i<=6;i++){
    const b = el('button',{}, `STEP${i}`);
    if(i===state.step) b.classList.add('active');
    else if(i<state.step) b.classList.add('done');
    b.addEventListener('click', ()=>{ state.step=i; saveState(); render(); window.scrollTo(0,0); });
    bar.appendChild(b);
  }
}

function renderSettings(){
  const body = document.getElementById('settingsBody');
  body.innerHTML = "";

  if(isPC()){
    // PC:全セクションを縦に並べる
    [buildPropertyPanel(), buildAllocationPanel(), buildExpenseUsagePanel(), buildYearUsagePanel(),
     buildPricePanel(), buildSaleTimingPanel(), buildReplacementPanel(),
     buildSaleExpensePanel(), buildMaintenancePanel(), buildLoanPanel()]
      .filter(Boolean).forEach(panel=> body.appendChild(panel));
  } else {
    // スマホ:現在のSTEPのみ
    if(state.step===6){
      body.appendChild(buildResultsContainer());
    } else {
      MOBILE_STEP_SECTIONS[state.step]().forEach(panel=> body.appendChild(panel));
    }
  }
}

function buildResultsContainer(){
  const c = el('div',{id:'resultsBodyMobile'});
  c.appendChild(buildResults());
  return c;
}

function renderResults(){
  if(isPC()){
    const rc = document.getElementById('resultsBodyPC');
    rc.innerHTML = "";
    rc.appendChild(buildResults());
  } else if(state.step===6){
    renderSettings(); // モバイルではSTEP6の中身=結果
  }
}

function render(){
  updateHeaderSummary();
  if(!isPC()){
    renderStepbar();
    document.getElementById('nextBtn').textContent = state.step<6 ? `次へ:${STEP_LABELS[state.step]||''}` : '入力に戻る';
  }
  renderSettings();
  if(isPC()) renderResults();
}

function goStep(delta){
  let next = state.step + delta;
  if(next<1) next = 1;
  if(next>6) next = 1;
  state.step = next;
  saveState();
  render();
  window.scrollTo(0,0);
}

/* =========================================================
   起動
========================================================= */
loadState();
render();
window.matchMedia('(min-width:900px)').addEventListener('change', ()=> render());
</script>
