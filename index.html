<script>
/* =========================================================
   0. 定数
========================================================= */

const STRUCTURES = ["木造","木造モルタル","軽量鉄骨造1","軽量鉄骨造2","重量鉄骨造","RC造","SRC造","れんが造"];

  "木造":        { 住宅用:{new:0.031, usedFallback:0.03030, legalLife:22, residentialLife:33}, 事業用:{new:0.042, usedFallback:0.04166, legalLife:24, residentialLife:24} },

  "重量鉄骨造":  { 住宅用:{new:0.020, usedFallback:0.01960, legalLife:34, residentialLife:51}, 事業用:{new:0.027, usedFallback:0.02631, legalLife:38, residentialLife:38} },
  "RC造":        { 住宅用:{new:0.015, usedFallback:0.01428, legalLife:47, residentialLife:70}, 事業用:{new:0.020, usedFallback:0.02000, legalLife:50, residentialLife:50} },

};

const PRICE_SCENARIOS = {
  best:     { label:"ベスト(年3%上昇)",       rates:[1.0000,1.0300,1.0299,1.0302,1.0300,1.0299,1.0300,1.0302,1.0299,1.0300,1.0300,1.0301,1.0300,1.0300,1.0300,1.0299] },
  moderate: { label:"モデレート(年1%上昇後安定)", rates:[1.0000,1.0100,1.0099,1.0102,1.0101,1.0100,1.0099,1.0102,1.0101,1.0100,1.0099,1.0000,1.0000,1.0000,1.0000,1.0000] },
  worst:    { label:"ワースト(年2-3%下落)",     rates:[1.0000,0.9800,0.9796,0.9792,0.9787,0.9783,0.9778,0.9773,0.9767,0.9762,0.9756,0.9700,0.9691,0.9681,0.9670,0.9659] }
};
const BASE_YEAR = 2026;
const SIM_YEARS = 35;

/* =========================================================
   1. 状態管理
========================================================= */
const defaultState = {
  step:1,
  propertyName:"", buildingName:"", floorNumber:null, roomNumber:"", direction:"南", isCornerUnit:false,
  contractDate:"", totalPrice:23000, currentPrice:null, historicalPrices:{}, historicalYearsShown:undefined,
  yearlyPriceOverrides:{}, yearlyRateOverrides:{},
  floorArea:71.37, structure:"RC造",
  buildType:"新築", completionDate:"", initialUse:"自宅用", planToMove:"予定なし",
  expenseRate:2.69, expenseAmount:null,
  allocMethod:"contract", contractLandPrice:null, contractBuildingPrice:null,
  consumptionTax:null, landAssessedValue:null, buildingAssessedValue:null, manualBuildingPrice:null,
  yearUsage:{},
  scenario:"moderate",
  saleDate:"2033-07-03",
  brokerageFeeRate:1.5,
  maintenanceFee:15000, repairFund:20000, propertyTax:120000, otherCost:0,
  repairIncrease:false,
  loanBalance:0, loanRate:1.0, loanType:"変動",
  nextPropertyPrice:null, nextExpenseRate:2.69, nextHoldingYears:10, nextScenario:"moderate",
  unlocked:false
};
let state = JSON.parse(JSON.stringify(defaultState));
let collapsedPanels = {};

function loadState(){
  try{
    const saved = localStorage.getItem('mansionbaikyaku_state');
    if(saved){ state = Object.assign({}, defaultState, JSON.parse(saved)); }
    if(!state.saleDate) state.saleDate = defaultState.saleDate;
    if(!state.yearlyRateOverrides) state.yearlyRateOverrides = {};
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem('mansionbaikyaku_state', JSON.stringify(state)); }catch(e){}
}
function buildFileNameBase(){
  const parts = [state.propertyName, state.buildingName, state.floorNumber?`${state.floorNumber}F`:null, state.direction, state.isCornerUnit?'角':null].filter(Boolean);
  return parts.length ? `売却益SIM_${parts.join(' ')}` : `売却益SIM`;
}
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = buildFileNameBase().replace(/[\\/:*?"<>|]+/g,'') + ".json";
  a.click();
  URL.revokeObjectURL(url);
}
function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      state = Object.assign({}, defaultState, data);
      saveState(); render();
    }catch(err){ alert("読み込みに失敗しました。ファイル形式をご確認ください。"); }
  };
  reader.readAsText(file);
}

/* =========================================================
   2. 計算ロジック
========================================================= */
function getSaleYear(s){ return s.saleDate ? new Date(s.saleDate).getFullYear() : BASE_YEAR + 7; }

function calcElapsedYears(fromDateStr, toDateStr){
  if(!fromDateStr || !toDateStr) return 0;
  const from = new Date(fromDateStr), to = new Date(toDateStr);
  let months = (to.getFullYear()-from.getFullYear())*12 + (to.getMonth()-from.getMonth());
  const dayDiff = to.getDate()-from.getDate();
  if(dayDiff < 0) months -= 1;
  let years = Math.floor(months/12);
  const remMonths = months % 12;
  if(remMonths >= 6) years += 1;
  return Math.max(years,0);
}

function determineBuildingPrice(s){
  const total = Number(s.totalPrice)||0;
  if(s.allocMethod==="contract" && s.contractLandPrice && s.contractBuildingPrice){
    return { building:Number(s.contractBuildingPrice), land:Number(s.contractLandPrice), method:"契約書記載" };
  }
  if(s.allocMethod==="tax" && s.consumptionTax){
    const TAX_RATE = 0.10;
    const buildingExTax = Number(s.consumptionTax)/TAX_RATE;
    const buildingIncTax = buildingExTax*(1+TAX_RATE);
    return { building:buildingIncTax, land: total-buildingIncTax, method:"消費税逆算" };
  }
  if(s.allocMethod==="assessed" && s.landAssessedValue && s.buildingAssessedValue){
    const ratio = Number(s.buildingAssessedValue)/(Number(s.landAssessedValue)+Number(s.buildingAssessedValue));
    return { building: total*ratio, land: total*(1-ratio), method:"固定資産税評価額按分" };
  }
  const b = Number(s.manualBuildingPrice)||0;
  return { building:b, land: total-b, method:"手入力" };
}

function allocateExpenses(totalExpenses, buildingPrice, totalPrice){
  const ratio = totalPrice>0 ? buildingPrice/totalPrice : 0;
  return { buildingExpenses: totalExpenses*ratio, landExpenses: totalExpenses*(1-ratio) };
}

function calcResidualUsefulLife(residentialLife, elapsedYearsAtPurchase){
  let n;
  if(elapsedYearsAtPurchase >= residentialLife){ n = Math.floor(residentialLife*0.2); }
  else { n = Math.floor((residentialLife-elapsedYearsAtPurchase) + elapsedYearsAtPurchase*0.2); }
  return Math.max(n,2);
}
function calcUsedDepreciationRate(n){ return Math.floor((1/n)*100000)/100000; }

function getDepreciationRateForYear(s, usage, buildingPriceAtPurchase, purchaseElapsedAtBuy){
  const usageKey = usage === "事業用" ? "事業用" : "住宅用";
  const table = DEPRECIATION_TABLE[s.structure]["住宅用"];
  const usageTable = DEPRECIATION_TABLE[s.structure][usageKey];
  if(s.buildType === "新築"){ return usageTable.new; }
  const n = calcResidualUsefulLife(table.residentialLife, purchaseElapsedAtBuy);
  return calcUsedDepreciationRate(n);
}

function getYearUsage(s, year){ return s.yearUsage[year] || s.initialUse; }

/* 将来(BASE_YEAR以降)の価格を、前年からの連鎖(価格 or 上昇率の上書き)で計算するシリーズ */
function buildFuturePriceSeries(s){
  const scenarioRates = PRICE_SCENARIOS[s.scenario].rates;
  const yoy = scenarioRates.map((r,i)=> i===0 ? 0 : (r/scenarioRates[i-1]) - 1);
  const purchasePrice = Number(s.totalPrice)||0;
  const currentBase = s.currentPrice ? Number(s.currentPrice) : purchasePrice;

  const series = {};
  for(let i=0;i<SIM_YEARS;i++){
    const y = BASE_YEAR + i;
    if(i===0){
      const ov = s.yearlyPriceOverrides && s.yearlyPriceOverrides[y];
      series[y] = (ov!==undefined && ov!==null && ov!=='') ? Number(ov) : currentBase;
      continue;
    }
    const prev = series[y-1];
    const priceOv = s.yearlyPriceOverrides && s.yearlyPriceOverrides[y];
    if(priceOv!==undefined && priceOv!==null && priceOv!==''){ series[y] = Number(priceOv); continue; }
    const rateOv = s.yearlyRateOverrides && s.yearlyRateOverrides[y];
    if(rateOv!==undefined && rateOv!==null && rateOv!==''){ series[y] = prev * (1+Number(rateOv)/100); continue; }
    const idx = Math.min(i, yoy.length-1);
    series[y] = prev * (1+yoy[idx]);
  }
  return series;
}

function priceForYear(s, year){
  const purchasePrice = Number(s.totalPrice)||0;
  const currentBase = s.currentPrice ? Number(s.currentPrice) : purchasePrice;
  const purchaseYear = s.contractDate ? new Date(s.contractDate).getFullYear() : BASE_YEAR;

  if(s.historicalPrices && s.historicalPrices[year]) return Number(s.historicalPrices[year]);

  if(year <= BASE_YEAR){
    if(year <= purchaseYear) return purchasePrice;
    if(purchaseYear >= BASE_YEAR) return currentBase;
    let loYear = purchaseYear, loPrice = purchasePrice;
    let hiYear = BASE_YEAR, hiPrice = currentBase;
    if(s.historicalPrices){
      Object.keys(s.historicalPrices).forEach(k=>{
        const ky = Number(k), kp = Number(s.historicalPrices[k]);
        if(!kp) return;
        if(ky < year && ky > loYear){ loYear = ky; loPrice = kp; }
        if(ky > year && ky < hiYear){ hiYear = ky; hiPrice = kp; }
      });
    }
    const span = Math.max(hiYear - loYear, 1);
    const cagr = Math.pow(hiPrice/loPrice, 1/span) - 1;
    return loPrice * Math.pow(1+cagr, year - loYear);
  }

  const series = buildFuturePriceSeries(s);
  if(series[year]!==undefined) return series[year];
  const lastYear = BASE_YEAR + SIM_YEARS - 1;
  const rates = PRICE_SCENARIOS[s.scenario].rates;
  const yoyLast = rates[rates.length-1]/rates[rates.length-2]-1;
  return series[lastYear] * Math.pow(1+yoyLast, year-lastYear);
}

function man(n){
  if(n===null||n===undefined||isNaN(n)) return "-";
  return Math.round(n).toLocaleString('ja-JP') + "万円";
}
function signedMan(n){
  if(n===null||n===undefined||isNaN(n)) return "-";
  const r = Math.round(n);
  const sign = r>0 ? '+' : (r<0 ? '-' : '');
  return sign + Math.abs(r).toLocaleString('ja-JP') + "万円";
}
function signedPct(n, digits){
  if(n===null||n===undefined||isNaN(n)) return "-";
  const v = n*100;
  const sign = v>0 ? '+' : (v<0 ? '' : '');
  return sign + v.toFixed(digits!==undefined?digits:1) + '%';
}

function computeTaxDetail(taxableGain, holdingYears){
  taxableGain = Math.max(taxableGain, 0);
  let income, resident;
  if(holdingYears < 5){ income = taxableGain * 0.3063; resident = taxableGain * 0.09; }
  else if(holdingYears < 10){ income = taxableGain * 0.15315; resident = taxableGain * 0.05; }
  else {
    const threshold = 6000;
    if(taxableGain <= threshold){ income = taxableGain * 0.1021; resident = taxableGain * 0.04; }
    else {
      income = threshold*0.1021 + (taxableGain-threshold)*0.15315;
      resident = threshold*0.04 + (taxableGain-threshold)*0.05;
    }
  }
  return { income, resident, total: income + resident };
}

function simulateReplacement(s, firstResult){
  if(s.planToMove !== '予定あり' || !s.nextPropertyPrice) return null;
  const nextPrice = Number(s.nextPropertyPrice);
  const nextExpense = nextPrice * (Number(s.nextExpenseRate)||2.69)/100;
  const nextHoldYears = Math.max(Number(s.nextHoldingYears)||10, 1);
  const rates = PRICE_SCENARIOS[s.nextScenario||'moderate'].rates;
  const idx = Math.max(0, Math.min(nextHoldYears, rates.length-1));
  const nextFutureSalePrice = nextPrice * rates[idx];
  const nextSaleExpense = nextFutureSalePrice * 0.015;

  const acqA = nextPrice + nextExpense;
  const gainA = nextFutureSalePrice - acqA - nextSaleExpense;
  const taxA = computeTaxDetail(gainA, nextHoldYears);
  const lifetimeTaxA = firstResult.detail3000.total + taxA.total;

  const acqB = Math.max(acqA - firstResult.deferredGain, 0);
  const gainB = nextFutureSalePrice - acqB - nextSaleExpense;
  const taxB = computeTaxDetail(gainB, nextHoldYears);
  const lifetimeTaxB = firstResult.detailDeferred.total + taxB.total;

  return {
    routeA:{ tax:taxA, lifetimeTax:lifetimeTaxA },
    routeB:{ tax:taxB, lifetimeTax:lifetimeTaxB },
    recommend: lifetimeTaxA <= lifetimeTaxB ? 'A' : 'B'
  };
}

function interpolateSalePrice(s){
  if(!s.saleDate) return priceForYear(s, getSaleYear(s));
  const d = new Date(s.saleDate);
  const y = d.getFullYear();
  const p0 = priceForYear(s, y);
  const p1 = priceForYear(s, y+1);
  const startOfYear = new Date(`${y}-01-01`);
  const daysInYear = ((y%4===0 && y%100!==0)||y%400===0) ? 366 : 365;
  const dayOfYear = Math.round((d - startOfYear)/86400000);
  const ratio = Math.max(0, Math.min(dayOfYear/daysInYear, 1));
  return p0 + (p1-p0)*ratio;
}

function runFullCalculation(s){
  const alloc = determineBuildingPrice(s);
  const expenseTotal = s.expenseAmount ? Number(s.expenseAmount) : Number(s.totalPrice)*Number(s.expenseRate)/100;
  const expAlloc = allocateExpenses(expenseTotal, alloc.building, Number(s.totalPrice));
  const buildingAcqCost = alloc.building + expAlloc.buildingExpenses;
  const landAcqCost = alloc.land + expAlloc.landExpenses;

  const purchaseElapsed = calcElapsedYears(s.completionDate, s.contractDate);
  const saleYear = getSaleYear(s);
  const holdingYears = calcElapsedYears(s.contractDate, s.saleDate || `${saleYear}-01-01`);

  let cumulativeDepreciation = 0;
  const startYear = s.contractDate ? new Date(s.contractDate).getFullYear() : BASE_YEAR;
  for(let y=startYear; y<saleYear; y++){
    const usage = getYearUsage(s, y);
    const rate = getDepreciationRateForYear(s, usage, alloc.building, purchaseElapsed);
    const annual = Math.min(buildingAcqCost*0.9*rate, buildingAcqCost*0.95 - cumulativeDepreciation);
    cumulativeDepreciation += Math.max(annual,0);
  }

  const acquisitionCost = (buildingAcqCost - cumulativeDepreciation) + landAcqCost;
  const salePrice = interpolateSalePrice(s);
  const saleExpense = salePrice * Number(s.brokerageFeeRate)/100;

  const gain = salePrice - acquisitionCost - saleExpense;
  const isLongTerm = holdingYears >= 5;

  const detailNoException = computeTaxDetail(gain, holdingYears);
  const gainAfter3000 = Math.max(gain - 3000, 0);
  const detail3000 = computeTaxDetail(gainAfter3000, holdingYears);
  const detailDeferred = { income:0, resident:0, total:0 };
  const deferredGain = Math.max(gain, 0);

  const netCash = {
    plan3000: salePrice - saleExpense - detail3000.total - Number(s.loanBalance),
    deferred: salePrice - saleExpense - detailDeferred.total - Number(s.loanBalance)
  };

  return { alloc, acquisitionCost, salePrice, saleExpense, gain, isLongTerm, holdingYears,
    detailNoException, detail3000, detailDeferred, deferredGain, netCash };
}

function calcAccruedGainForYear(s, year){
  const price = priceForYear(s, year);
  const purchaseExpenseTotal = s.expenseAmount ? Number(s.expenseAmount) : Number(s.totalPrice)*Number(s.expenseRate)/100;
  const saleExpenseAtYear = price * Number(s.brokerageFeeRate)/100;
  return price - Number(s.totalPrice) - purchaseExpenseTotal - saleExpenseAtYear;
}

function computeDepreciationSeries(s, maxYearExclusive){
  const alloc = determineBuildingPrice(s);
  const expenseTotal = s.expenseAmount ? Number(s.expenseAmount) : Number(s.totalPrice)*Number(s.expenseRate)/100;
  const expAlloc = allocateExpenses(expenseTotal, alloc.building, Number(s.totalPrice));
  const buildingAcqCost = alloc.building + expAlloc.buildingExpenses;
  const landAcqCost = alloc.land + expAlloc.landExpenses;
  const purchaseElapsedAtBuy = calcElapsedYears(s.completionDate, s.contractDate);
  const purchaseYear = s.contractDate ? new Date(s.contractDate).getFullYear() : BASE_YEAR;

  let cumulative = 0;
  const series = {};
  for(let y=purchaseYear; y<maxYearExclusive; y++){
    const usage = getYearUsage(s, y);
    const rate = getDepreciationRateForYear(s, usage, alloc.building, purchaseElapsedAtBuy);
    series[y] = { cumulativeBefore: cumulative, rate };
    const annual = Math.min(buildingAcqCost*0.9*rate, buildingAcqCost*0.95 - cumulative);
    cumulative += Math.max(annual,0);
  }
  series[maxYearExclusive] = { cumulativeBefore: cumulative, rate: null };
  return { series, buildingAcqCost, landAcqCost, alloc };
}

/* 年別詳細表(購入年から35年)。売却益(課税後)は「含み益 − 税額」で算出する */
function computeYearlyTable(s){
  const purchaseYear = s.contractDate ? new Date(s.contractDate).getFullYear() : BASE_YEAR;
  const endYear = purchaseYear + SIM_YEARS;
  const dep = computeDepreciationSeries(s, endYear+1);
  const tsubo = Number(s.floorArea)>0 ? Number(s.floorArea)/3.30578 : 0;
  const purchasePrice = Number(s.totalPrice)||0;
  const purchaseExpenseTotal = s.expenseAmount ? Number(s.expenseAmount) : purchasePrice*Number(s.expenseRate)/100;
  const contractD = s.contractDate ? new Date(s.contractDate) : new Date(`${purchaseYear}-01-01`);

  const rows = [];
  let prevPrice = null;
  for(let y=purchaseYear; y<=endYear; y++){
    const price = priceForYear(s,y);
    const pricePerTsubo = tsubo>0 ? price/tsubo : 0;
    const growthRateYoY = prevPrice ? (price/prevPrice - 1) : null;
    const priceChange = price - purchasePrice;
    const priceChangeRate = purchasePrice ? priceChange/purchasePrice : 0;
    const priceChangePerTsubo = tsubo>0 ? priceChange/tsubo : 0;
    const accruedGain = calcAccruedGainForYear(s,y);

    const expenseThisYear = y===purchaseYear ? purchaseExpenseTotal : price*Number(s.brokerageFeeRate)/100;
    const expenseRateDisplay = y===purchaseYear ? Number(s.expenseRate) : Number(s.brokerageFeeRate);
    const buildingExpensePortion = purchasePrice ? expenseThisYear*(dep.alloc.building/purchasePrice) : 0;

    const anniversary = new Date(contractD.getTime());
    anniversary.setFullYear(y);
    const realDays = Math.max(Math.round((anniversary - contractD)/86400000), 0);
    const realYears = realDays/365.25;
    const jan1 = new Date(`${y}-01-01`);
    const taxDays = Math.max(Math.round((jan1 - contractD)/86400000), 0);
    const taxYears = Math.floor(taxDays/365.25);
    const classification = taxYears>=5 ? '長期' : '短期';

    const cumulativeDep = dep.series[y] ? dep.series[y].cumulativeBefore : 0;
    const rateUsed = dep.series[y] ? dep.series[y].rate : 0;
    const acquisitionCost = (dep.buildingAcqCost - cumulativeDep) + dep.landAcqCost;
    const taxableGainRaw = price - acquisitionCost - expenseThisYear;
    const exemption3000 = Math.min(Math.max(taxableGainRaw,0), 3000);
    const taxableAfter3000 = Math.max(taxableGainRaw - 3000, 0);
    const taxDetail = computeTaxDetail(taxableAfter3000, taxYears);
    const netProfit = accruedGain - taxDetail.total; // 売却益(課税後) = 含み益 − 税額

    rows.push({
      year:y, price, pricePerTsubo, growthRateYoY, priceChange, priceChangeRate, priceChangePerTsubo,
      accruedGain, expenseThisYear, expenseRateDisplay, buildingExpensePortion, buildingPrice: dep.alloc.building,
      realYears, realDays, taxYears, taxDays, classification,
      depreciationYearsUsed: y-purchaseYear, rateUsed: rateUsed||0, cumulativeDep, acquisitionCost,
      taxableGainRaw, exemption3000, taxableAfter3000,
      taxTotal: taxDetail.total, taxIncome: taxDetail.income, taxResident: taxDetail.resident,
      netProfit
    });
    prevPrice = price;
  }
  return rows;
}

async function verifyPasscode(input){
  try{
    const res = await fetch(WORKER_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ passcode: input }) });
    if(!res.ok) return false;
    const data = await res.json();

  }catch(e){ console.error("パスコード確認に失敗しました", e); return false; }
}

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='html') e.innerHTML = v;
    else if(k.startsWith('on')) e.addEventListener(k.substring(2), v);
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(typeof c === 'string') e.appendChild(document.createTextNode(c));
    else if(c) e.appendChild(c);
  });
  return e;
}
function field(labelText, inputEl, hint){
  const wrap = el('div',{class:'field'});
  wrap.appendChild(el('label',{},labelText));
  wrap.appendChild(inputEl);
  if(hint) wrap.appendChild(el('div',{class:'hint'},hint));
  return wrap;
}
function bindInput(input, key, isNumber){
  input.value = state[key] ?? "";
  input.addEventListener('input', ()=>{
    state[key] = isNumber ? (input.value===""?null:Number(input.value)) : input.value;
    saveState();
    updateHeaderSummary();
  });
  return input;
}
function bindSelect(select, key, options, rerenderOnChange){
  options.forEach(o=>{
    const opt = document.createElement('option');
    opt.value = o; opt.textContent = o;
    if(state[key]===o) opt.selected = true;
    select.appendChild(opt);
  });
  select.addEventListener('change', ()=>{
    state[key]=select.value; saveState(); updateHeaderSummary();
    if(rerenderOnChange) renderSettings();
  });
  return select;
}
function formatComma(n){
  if(n===null||n===undefined||n==='') return '';
  const num = Number(n);
  if(isNaN(num)) return '';
  return num.toLocaleString('ja-JP');
}
function bindMoneyInput(key, placeholder){
  const input = el('input',{type:'text', inputmode:'numeric'});
  if(placeholder) input.setAttribute('placeholder', placeholder);
  input.value = formatComma(state[key]);
  input.addEventListener('input', ()=>{
    const raw = input.value.replace(/[^0-9.\-]/g,'');
    state[key] = raw===''? null : Number(raw);
    saveState();
    input.value = raw===''? '' : formatComma(Number(raw));
  });
  return input;
}
function createMoneyInput(getValue, setValue, placeholder){
  const input = el('input',{type:'text', inputmode:'numeric'});
  if(placeholder) input.setAttribute('placeholder', placeholder);
  const v = getValue();
  input.value = formatComma(v);
  input.addEventListener('input', ()=>{
    const raw = input.value.replace(/[^0-9.\-]/g,'');
    const num = raw===''? null : Number(raw);
    setValue(num);
    input.value = raw===''? '' : formatComma(num);
  });
  return input;
}
function isPC(){ return window.matchMedia('(min-width:900px)').matches; }

function makePanel(title, id){
  const panel = el('div',{class:'panel'});
  if(id) panel.setAttribute('id', id);
  const head = el('div',{class:'panel-head'});
  const titleWrap = el('div',{class:'title-wrap'});
  titleWrap.appendChild(el('span',{class:'diamond'}));
  titleWrap.appendChild(el('h2',{},title));
  head.appendChild(titleWrap);
  const chevron = el('span',{class:'chevron'}, collapsedPanels[title] ? '▸' : '▾');
  head.appendChild(chevron);
  const body = el('div',{class:'panel-body'});
  if(collapsedPanels[title]) body.style.display = 'none';
  head.addEventListener('click', ()=>{
    const hidden = body.style.display==='none';
    body.style.display = hidden ? '' : 'none';
    chevron.textContent = hidden ? '▾' : '▸';
    collapsedPanels[title] = !hidden;
  });
  panel.appendChild(head);
  panel.appendChild(body);
  return { panel, body };
}

function buildPricePanel(){
  const { panel, body } = makePanel('価格予測シナリオ', 'panel-scenario');

  const seg = el('div',{class:'segmented'});
  Object.entries(PRICE_SCENARIOS).forEach(([key,v])=>{
    const btn = el('button',{}, v.label.split('(')[0]);
    if(state.scenario===key) btn.classList.add('active');
    btn.addEventListener('click', ()=>{ state.scenario=key; saveState(); renderSettings(); });
    seg.appendChild(btn);
  });
  body.appendChild(field('市場予測パターン', seg, '選んだパターンに基づく各年の予測価格が下の表のプレースホルダーに反映されます。'));

  body.appendChild(el('h3',{class:'sub'},`年別の価格予想(${BASE_YEAR}年〜${BASE_YEAR+SIM_YEARS-1}年・35年分)`));
  body.appendChild(el('div',{class:'hint', style:'margin-bottom:6px;'},
    '「価格」と「対前年上昇率」はどちらからでも編集できます。±ボタンでも調整できます(価格:100万円単位、上昇率:0.5%単位)。'));

  const headRow = el('div',{class:'price-editor-head'});
  headRow.appendChild(el('span',{class:'py'},''));
  headRow.appendChild(el('span',{class:'p-input'},'価格(万円)'));
  headRow.appendChild(el('span',{class:'r-input'},'対前年%'));
  body.appendChild(headRow);

  function stepBtn(label){
    return el('button',{class:'btn small', style:'padding:5px 8px;font-size:12px;line-height:1;flex-shrink:0;'}, label);
  }

  const editor = el('div',{class:'price-editor'});
  const series = buildFuturePriceSeries(state);
  for(let y=BASE_YEAR; y<BASE_YEAR+SIM_YEARS; y++){
    const isOverridden = (y===BASE_YEAR)
      ? !!state.currentPrice
      : !!(state.yearlyPriceOverrides[y] || state.yearlyRateOverrides[y]);
    const row = el('div',{class:'pr'+(isOverridden?' overridden':'')});
    row.appendChild(el('span',{class:'py'},`${y}年`));

    const priceGroup = el('div',{style:'display:flex;align-items:center;gap:3px;flex:1.3;min-width:0;'});
    const priceMinus = stepBtn('－');
    const priceInput = el('input',{type:'text', inputmode:'numeric', class:'p-input', style:'flex:1;min-width:0;'});
    const priceAt = stepBtn('＋');
    const placeholderPrice = Math.round(series[y]).toLocaleString('ja-JP');
    priceInput.setAttribute('placeholder', placeholderPrice);

    function getCurrentPriceVal(){
      if(y===BASE_YEAR) return state.currentPrice!==null && state.currentPrice!==undefined ? Number(state.currentPrice) : series[y];
      return state.yearlyPriceOverrides[y]!==undefined ? Number(state.yearlyPriceOverrides[y]) : series[y];
    }
    function setPriceVal(v){
      if(y===BASE_YEAR){ state.currentPrice = v; }
      else{ state.yearlyPriceOverrides[y] = v; delete state.yearlyRateOverrides[y]; }
      saveState(); renderSettings();
    }

    if(y===BASE_YEAR){
      priceInput.value = state.currentPrice ? formatComma(state.currentPrice) : '';
      priceInput.addEventListener('change', ()=>{
        const raw = priceInput.value.replace(/[^0-9.\-]/g,'');
        setPriceVal(raw===''?null:Number(raw));
      });
    } else {
      priceInput.value = state.yearlyPriceOverrides[y] ? formatComma(state.yearlyPriceOverrides[y]) : '';
      priceInput.addEventListener('change', ()=>{
        const raw = priceInput.value.replace(/[^0-9.\-]/g,'');
        if(raw===''){ delete state.yearlyPriceOverrides[y]; saveState(); renderSettings(); }
        else{ setPriceVal(Number(raw)); }
      });
    }
    priceMinus.addEventListener('click', ()=> setPriceVal(Math.round((getCurrentPriceVal()-100)/100)*100));
    priceAt.addEventListener('click', ()=> setPriceVal(Math.round((getCurrentPriceVal()+100)/100)*100));
    priceGroup.appendChild(priceMinus); priceGroup.appendChild(priceInput); priceGroup.appendChild(priceAt);
    row.appendChild(priceGroup);

    if(y===BASE_YEAR){
      const baseBox = el('input',{type:'text', class:'r-input', disabled:'disabled'});
      baseBox.value = '基準年';
      baseBox.style.textAlign = 'center';
      baseBox.style.color = 'var(--ink-soft)';
      baseBox.style.background = '#F0EFEA';
      const spacer = el('div',{style:'display:flex;align-items:center;gap:3px;flex:1;min-width:0;'});
      spacer.appendChild(baseBox);
      row.appendChild(spacer);
    } else {
      const rateGroup = el('div',{style:'display:flex;align-items:center;gap:3px;flex:1;min-width:0;'});
      const rateMinus = stepBtn('－');
      const rateInput = el('input',{type:'text', class:'r-input', style:'flex:1;min-width:0;'});
      const rateAt = stepBtn('＋');
      const impliedRate = (series[y]/series[y-1]-1)*100;
      rateInput.setAttribute('placeholder', impliedRate.toFixed(1));
      rateInput.value = state.yearlyRateOverrides[y]!==undefined ? Number(state.yearlyRateOverrides[y]).toFixed(1) : '';

      function getCurrentRateVal(){
        return state.yearlyRateOverrides[y]!==undefined ? Number(state.yearlyRateOverrides[y]) : impliedRate;
      }
      function setRateVal(v){
        state.yearlyRateOverrides[y] = Math.round(v*10)/10;
        delete state.yearlyPriceOverrides[y];
        saveState(); renderSettings();
      }
      rateInput.addEventListener('change', ()=>{
        const raw = rateInput.value.replace(/[^0-9.\-]/g,'');
        if(raw===''){ delete state.yearlyRateOverrides[y]; saveState(); renderSettings(); }
        else{ setRateVal(Number(raw)); }
      });
      rateMinus.addEventListener('click', ()=> setRateVal(getCurrentRateVal()-0.5));
      rateAt.addEventListener('click', ()=> setRateVal(getCurrentRateVal()+0.5));
      rateGroup.appendChild(rateMinus); rateGroup.appendChild(rateInput); rateGroup.appendChild(rateAt);
      row.appendChild(rateGroup);
    }
    editor.appendChild(row);
  }
  body.appendChild(editor);

  const resetBtn = el('button',{class:'btn small', style:'margin-top:8px;'},'手入力をすべてクリア');
  resetBtn.addEventListener('click', ()=>{
    state.yearlyPriceOverrides = {}; state.yearlyRateOverrides = {};
    saveState(); renderSettings();
  });
  body.appendChild(resetBtn);
  return panel;
}

  note.innerHTML = '3,000万円特別控除を選択すると、その前後数年間(目安:控除適用年から4年程度)は新居の住宅ローン控除が使えなくなる可能性があります。また、各特例の適用期限・要件は税制改正により変更されることがあります。最終的な判断の前に、税理士または国税庁サイトでのご確認をおすすめします。';
  wrap.appendChild(note);

  return wrap;
}

function renderYearlyTables(rows, saleYear){
  const groups = [
    { title:'物件価格・含み益', metrics:[
      ['物件価格', r=>man(r.price)],
      ['坪単価', r=>man(r.pricePerTsubo)],
      ['価格上昇率(対前年)', r=> r.growthRateYoY===null?'-':signedPct(r.growthRateYoY), true],
      ['価格変動幅(購入価格比)', r=>signedMan(r.priceChange)],
      ['価格変動率', r=>signedPct(r.priceChangeRate,0)],
      ['売買価格差坪単価', r=>signedMan(r.priceChangePerTsubo)],
      ['含み益', r=>signedMan(r.accruedGain)],
      ['諸経費(購入時/売却時)', r=>man(r.expenseThisYear)],
      ['経費率', r=>r.expenseRateDisplay.toFixed(2)+'%'],
      ['うち建物分', r=>man(r.buildingExpensePortion)],
      ['建物価格', r=>man(r.buildingPrice)]
    ]},
    { title:'課税対象額の計算', metrics:[
      ['所有期間(実質・年)', r=>r.realYears.toFixed(1)],
      ['所有期間(実質・日)', r=>r.realDays.toLocaleString()],
      ['譲渡課税上の所有期間(年)', r=>r.taxYears],
      ['譲渡課税上の所有期間(日)', r=>r.taxDays.toLocaleString()],
      ['譲渡所得課税分類', r=>r.classification],
      ['減価償却年数', r=>r.depreciationYearsUsed],
      ['減価償却率 r', r=>r.rateUsed.toFixed(5)],
      ['減価償却費(累計)', r=>man(r.cumulativeDep)],
      ['取得費', r=>man(r.acquisitionCost)],
      ['譲渡所得', r=>man(r.taxableGainRaw)],
      ['3,000万円特別控除分', r=>man(r.exemption3000)],
      ['通常課税分', r=>man(r.taxableAfter3000)]
    ]},
    { title:'課税額・売却益', metrics:[
      ['課税額合計', r=>man(r.taxTotal)],
      ['　うち所得税', r=>man(r.taxIncome)],
      ['　うち住民税', r=>man(r.taxResident)],
      ['売却益(課税後)', r=>signedMan(r.netProfit)]
    ]}
  ];

  const scroll = el('div',{class:'yearly-scroll'});
  const table = el('table',{class:'yearly-table'});

  function makeYearCell(tag, r, extraClass){
    const attrs = {'data-year':String(r.year)};
    if(extraClass) attrs.class = extraClass;
    const cell = el(tag, attrs, String(r.year));
    if(saleYear!==undefined && Number(r.year)===Number(saleYear)) cell.classList.add('sale-year-col');
    cell.addEventListener('mouseenter', ()=>setHighlightedYear(r.year));
    cell.addEventListener('mouseleave', ()=>setHighlightedYear(null));
    return cell;
  }

  groups.forEach(g=>{
    const headRow = el('tr',{class:'group-head-row'});
    headRow.appendChild(el('td',{class:'group-label'}, g.title));
    rows.forEach(r=> headRow.appendChild(makeYearCell('td', r)));
    table.appendChild(headRow);

    g.metrics.forEach(([label, fn, indent])=>{
      const tr = document.createElement('tr');
      tr.appendChild(el('td',{}, label));
      rows.forEach(r=>{
        const attrs = {'data-year':String(r.year)};
        const td = el('td', attrs, String(fn(r)));
        if(indent) td.classList.add('indent');
        if(saleYear!==undefined && Number(r.year)===Number(saleYear)) td.classList.add('sale-year-col');
        td.addEventListener('mouseenter', ()=>setHighlightedYear(r.year));
        td.addEventListener('mouseleave', ()=>setHighlightedYear(null));
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
  });

  scroll.appendChild(table);
  return scroll;
}

let highlightedYear = null;
function setHighlightedYear(year){
  highlightedYear = year;
  try{
    document.querySelectorAll('[data-year]').forEach(elm=>{
      if(year!==null && Number(elm.getAttribute('data-year'))===Number(year)) elm.classList.add('hl-year');
      else elm.classList.remove('hl-year');
    });
  }catch(e){}
  if(chartInstance && chartInstance._barBaseColors){
    const bar = chartInstance.data.datasets.find(d=>d.type==='bar');
    if(bar){
      bar.backgroundColor = chartInstance.data.labels.map((l,i)=> Number(l)===Number(year) ? '#0D5A40' : chartInstance._barBaseColors[i]);
      chartInstance.update('none');
    }
  }
}

function drawChart(canvas, s){
  if(chartInstance) chartInstance.destroy();
  const rows = computeYearlyTable(s);
  const purchaseYear = s.contractDate ? new Date(s.contractDate).getFullYear() : BASE_YEAR;
  const saleYear = getSaleYear(s);
  const hasHistory = s.historicalPrices && Object.keys(s.historicalPrices).length>0;
  const chartStartYear = hasHistory ? purchaseYear : BASE_YEAR;
  const maxChartYear = BASE_YEAR + 15;
  const visible = rows.filter(r=> r.year >= chartStartYear && r.year <= maxChartYear);

  const labels = visible.map(r=>r.year);
  const netProfit = visible.map(r=>Math.round(r.netProfit));
  const priceDiff = visible.map(r=>Math.round(r.priceChange));
  const accrued  = visible.map(r=>Math.round(r.accruedGain));

  const GREEN = '#147B58';
  const GREEN_BAR = '#8FC7B4';
  const LIGHT_GRAY = '#D6D5D0';
  const DARK_GRAY = '#8A8985';

  const barColors = visible.map(r=> r.year < BASE_YEAR ? (r.year===purchaseYear ? DARK_GRAY : LIGHT_GRAY) : GREEN_BAR);
  const barBorderColors = visible.map(r=> Number(r.year)===Number(saleYear) ? '#0D5A40' : 'rgba(0,0,0,0.15)');
  const barBorderWidths = visible.map(r=> Number(r.year)===Number(saleYear) ? 3 : 1);

  const hasDatalabels = !!window.ChartDataLabels;
  if(hasDatalabels && !Chart._klRegistered){ Chart.register(window.ChartDataLabels); Chart._klRegistered = true; }

  chartInstance = new Chart(canvas, {
    data:{
      labels,
      datasets:[
        {
          type:'bar', label:'売却益(課税後)', data:netProfit,
          backgroundColor:barColors, borderColor:barBorderColors, borderWidth:barBorderWidths, order:3,
          datalabels: hasDatalabels ? {
            anchor:'center', align:'center', color:'#123', font:{size:9,weight:'bold'},
            formatter: v=> Math.round(v).toLocaleString()
          } : undefined
        },
        {
          type:'line', label:'売買価格差', data:priceDiff, borderWidth:2, pointRadius:0, tension:0.2, order:1,
          segment:{ borderColor: ctx=>{ const yr=visible[ctx.p1DataIndex].year; return yr<BASE_YEAR ? (yr===purchaseYear?DARK_GRAY:LIGHT_GRAY) : GREEN; } },
          borderColor: GREEN,
          datalabels: hasDatalabels ? {
            align:'top', color: GREEN, font:{size:9,weight:'bold'},
            formatter: v=> (v>=0?'+':'') + Math.round(v).toLocaleString()
          } : undefined
        },
        {
          type:'line', label:'含み益', data:accrued, borderWidth:2, pointRadius:0, tension:0.2, borderDash:[4,4], order:2,
          segment:{ borderColor: ctx=>{ const yr=visible[ctx.p1DataIndex].year; return yr<BASE_YEAR ? (yr===purchaseYear?DARK_GRAY:LIGHT_GRAY) : GREEN; } },
          borderColor: GREEN,
          datalabels: { display:false }
        }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      onHover:(evt, elements)=>{
        if(elements.length){ setHighlightedYear(visible[elements[0].index].year); }
        else{ setHighlightedYear(null); }
      },
      plugins:{
        legend:{ display:true, position:'top', labels:{ font:{size:10}, boxWidth:18 } },
        datalabels: hasDatalabels ? {} : undefined
      },
      scales:{
        y:{ beginAtZero:true, ticks:{ font:{size:10} }, grid:{ color:'rgba(20,50,45,0.18)' } },
        x:{ ticks:{ font:{size:10} }, grid:{ color:'rgba(20,50,45,0.10)' } }
      }
    }
  });
  chartInstance._barBaseColors = barColors;
}

/* =========================================================
   8. 画面描画(PC/スマホ分岐)
========================================================= */
const STEP_LABELS = ["基本","用途","シナリオ","売却","維持費","結果"];
const NAV_CATEGORIES = [
  { key:'basic', label:'基本', target:'panel-basic' },
  { key:'usage', label:'用途', target:'panel-usage' },
  { key:'scenario', label:'シナリオ', target:'panel-scenario' },
  { key:'sale', label:'売却', target:'panel-sale' },
  { key:'maintenance', label:'維持費', target:'panel-maintenance' }
];

const MOBILE_STEP_SECTIONS = {
  1: ()=>[buildBasicPanel()],
  2: ()=>[buildUsagePanel(), buildReplacementPanel()].filter(Boolean),
  3: ()=>[buildPricePanel()],
  4: ()=>[buildSaleSettingsPanel()],
  5: ()=>[buildMaintenancePanel()],
  6: ()=>[]
};

function renderStepbar(){
  const bar = document.getElementById('stepbar');
  bar.innerHTML = "";
  for(let i=1;i<=6;i++){
    const b = el('button',{}, STEP_LABELS[i-1]);
    if(i===state.step) b.classList.add('active');
    else if(i<state.step) b.classList.add('done');
    b.addEventListener('click', ()=>{ state.step=i; saveState(); render(); window.scrollTo(0,0); });
    bar.appendChild(b);
  }
}

function renderPCNav(){
  const nav = document.getElementById('pcNav');
  if(!nav) return;
  nav.innerHTML = "";
  NAV_CATEGORIES.forEach(cat=>{
    const btn = el('button',{class:'btn small pc-nav-btn'}, cat.label);
    btn.addEventListener('click', ()=>{
      const target = document.getElementById(cat.target);
      if(target && target.scrollIntoView) target.scrollIntoView({behavior:'smooth', block:'start'});
    });
    nav.appendChild(btn);
  });
}

function renderSettings(){
  const body = document.getElementById('settingsBody');
  body.innerHTML = "";

  if(isPC()){
    [buildBasicPanel(), buildUsagePanel(), buildReplacementPanel(),
     buildPricePanel(), buildSaleSettingsPanel(), buildMaintenancePanel()]
      .filter(Boolean).forEach(panel=> body.appendChild(panel));
  } else {
    if(state.step===6){ body.appendChild(buildResults()); }
    else { MOBILE_STEP_SECTIONS[state.step]().forEach(panel=> body.appendChild(panel)); }
  }
}

function renderResults(){
  if(isPC()){
    const rc = document.getElementById('resultsBodyPC');
    rc.innerHTML = "";
    rc.appendChild(buildResults());
  } else if(state.step===6){
    renderSettings();
  }
}

function render(){
  updateHeaderSummary();
  if(!isPC()){
    renderStepbar();
    document.getElementById('nextBtn').textContent = state.step<6 ? `次へ:${STEP_LABELS[state.step]||''}` : '入力に戻る';
  } else {
    renderPCNav();
  }
  renderSettings();
  if(isPC()) renderResults();
}

function goStep(delta){
  let next = state.step + delta;
  if(next<1) next = 1;
  if(next>6) next = 1;
  state.step = next;
  saveState();
  render();
  window.scrollTo(0,0);
}

/* =========================================================
   起動
========================================================= */
loadState();
render();
window.matchMedia('(min-width:900px)').addEventListener('change', ()=> render());
</script>
